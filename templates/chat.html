<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radium Chat — Group</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080b0f;
    --surface: #0d1117;
    --surface2: #111820;
    --border: #1a2535;
    --accent: #00e5ff;
    --accent2: #7b2fff;
    --text: #e8edf3;
    --muted: #4a5a70;
    --muted2: #2e3f52;
    --self-bg: linear-gradient(135deg, rgba(0,229,255,0.15), rgba(123,47,255,0.15));
    --self-border: rgba(0,229,255,0.3);
    --system-color: #f59e0b;
    --radius: 12px;
    --header-h: 64px;
    --input-h: 80px;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    display: flex;
    flex-direction: column;
  }

  /* Background grid */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── Header ── */
  header {
    position: relative; z-index: 10;
    height: var(--header-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 24px;
    gap: 16px;
    flex-shrink: 0;
  }

  .logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }

  .header-title {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: -0.3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .header-sub {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  .header-info { display: flex; flex-direction: column; gap: 2px; }

  .header-right {
    margin-left: auto;
    display: flex; align-items: center; gap: 16px;
  }

  .online-badge {
    display: flex; align-items: center; gap: 6px;
    background: rgba(0,229,255,0.06);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--accent);
  }

  .online-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #22c55e;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,0.5)}
    50%{box-shadow:0 0 0 5px rgba(34,197,94,0)}
  }

  .user-chip {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px;
    color: var(--text);
  }

  .avatar {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: #fff;
    flex-shrink: 0;
  }

  .logout-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 10px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
    display: inline-flex; align-items: center;
  }

  .logout-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── Messages ── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0;
    position: relative; z-index: 1;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--muted2); border-radius: 4px; }

  .msg-wrapper {
    display: flex;
    padding: 4px 24px;
    gap: 12px;
    animation: msgIn 0.25s cubic-bezier(.16,1,.3,1) both;
    align-items: flex-end;
  }

  @keyframes msgIn {
    from { opacity:0; transform: translateY(8px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .msg-wrapper.self {
    flex-direction: row-reverse;
  }

  .msg-avatar {
    width: 28px; height: 28px;
    border-radius: 7px;
    background: linear-gradient(135deg, var(--accent2), #1a4fff);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 11px;
    color: #fff;
    flex-shrink: 0;
  }

  .msg-wrapper.self .msg-avatar {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
  }

  .msg-body { max-width: 72%; display: flex; flex-direction: column; gap: 4px; }
  .msg-wrapper.self .msg-body { align-items: flex-end; }

  .msg-meta {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--muted);
  }

  .msg-wrapper.self .msg-meta { flex-direction: row-reverse; }

  .msg-username {
    font-weight: 500;
    color: var(--accent);
  }

  .msg-wrapper.self .msg-username { color: var(--accent2); }

  .msg-bubble {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px 14px 14px 4px;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.55;
    word-break: break-word;
    color: var(--text);
  }

  .msg-wrapper.self .msg-bubble {
    background: var(--self-bg);
    border-color: var(--self-border);
    border-radius: 14px 14px 4px 14px;
  }

  /* System messages */
  .system-msg {
    text-align: center;
    font-size: 11px;
    color: var(--system-color);
    opacity: 0.7;
    padding: 6px 24px;
    letter-spacing: 0.5px;
  }

  /* Date divider */
  .day-divider {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 24px;
    font-size: 11px; color: var(--muted);
    letter-spacing: 1px;
  }

  .day-divider::before, .day-divider::after {
    content: ''; flex: 1;
    height: 1px; background: var(--border);
  }

  /* ── Input area ── */
  .input-area {
    position: relative; z-index: 10;
    flex-shrink: 0;
    height: var(--input-h);
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 20px;
    gap: 12px;
  }

  #msg-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: var(--text);
    outline: none;
    resize: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    height: 48px;
    line-height: 1.4;
  }

  #msg-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,229,255,0.08);
  }

  #msg-input::placeholder { color: var(--muted); }

  #send-btn {
    width: 48px; height: 48px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, box-shadow 0.15s;
    flex-shrink: 0;
  }

  #send-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 20px rgba(0,229,255,0.3);
  }

  #send-btn:active { transform: scale(0.96); }

  /* typing indicator */
  .typing-area {
    position: relative; z-index: 10;
    height: 22px;
    padding: 0 24px;
    font-size: 11px;
    color: var(--muted);
    display: flex; align-items: center;
    background: var(--surface);
    gap: 6px;
  }

  .typing-dots span {
    display: inline-block;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--muted);
    animation: typingBounce 1.2s infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%,60%,100%{ transform: translateY(0); }
    30%{ transform: translateY(-4px); }
  }

  #typing-indicator { display: none; }

  /* empty state */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    font-size: 13px;
    gap: 8px;
  }

  .empty-state .icon { font-size: 36px; }
</style>
</head>
<body>

<header>
  <div class="logo-icon">⚡</div>
  <div class="header-info">
    <span class="header-title">RADIUM CHAT</span>
    <span class="header-sub">GROUP — PUBLIC ROOM</span>
  </div>
  <div class="header-right">
    <div class="online-badge">
      <span class="online-dot"></span>
      <span id="online-count">online</span>
    </div>
    <div class="user-chip">
      <div class="avatar" id="my-avatar"></div>
      <span id="my-name">{{ username }}</span>
    </div>
    <a href="/logout" class="logout-btn">sign out</a>
  </div>
</header>

<div id="messages">
  {% if history %}
    <div class="day-divider">RECENT MESSAGES</div>
    {% for msg in history %}
    <div class="msg-wrapper {% if msg.self %}self{% endif %}">
      <div class="msg-avatar">{{ msg.username[0].upper() }}</div>
      <div class="msg-body">
        <div class="msg-meta">
          <span class="msg-username">{{ msg.username }}</span>
          <span>{{ msg.timestamp }}</span>
        </div>
        <div class="msg-bubble">{{ msg.content }}</div>
      </div>
    </div>
    {% endfor %}
  {% else %}
    <div class="empty-state">
      <span class="icon">⚡</span>
      <span>No messages yet — say hello!</span>
    </div>
  {% endif %}
</div>

<div class="typing-area">
  <div id="typing-indicator">
    <span id="typing-text"></span>
    <span class="typing-dots"><span></span><span></span><span></span></span>
  </div>
</div>

<div class="input-area">
  <input type="text" id="msg-input" placeholder="Message everyone…" maxlength="1000" autocomplete="off">
  <button id="send-btn" title="Send">➤</button>
</div>

<script>
  const ME = "{{ username }}";
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('msg-input');
  const sendBtn    = document.getElementById('send-btn');
  const typingEl   = document.getElementById('typing-indicator');
  const typingText = document.getElementById('typing-text');

  // Set avatar letter
  document.getElementById('my-avatar').textContent = ME[0].toUpperCase();

  const socket = io();
  let typingTimeout = null;
  let typingUsers = new Set();

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeEmpty() {
    const empty = messagesEl.querySelector('.empty-state');
    if (empty) empty.remove();
  }

  function appendMessage(data, isSelf) {
    removeEmpty();
    const wrapper = document.createElement('div');
    wrapper.className = 'msg-wrapper' + (isSelf ? ' self' : '');
    wrapper.innerHTML = `
      <div class="msg-avatar">${data.username[0].toUpperCase()}</div>
      <div class="msg-body">
        <div class="msg-meta">
          <span class="msg-username">${escHtml(data.username)}</span>
          <span>${data.timestamp}</span>
        </div>
        <div class="msg-bubble">${escHtml(data.content)}</div>
      </div>`;
    messagesEl.appendChild(wrapper);
    scrollBottom();
  }

  function appendSystem(msg) {
    const el = document.createElement('div');
    el.className = 'system-msg';
    el.textContent = msg;
    messagesEl.appendChild(el);
    scrollBottom();
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
              .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // Send message
  function sendMessage() {
    const content = inputEl.value.trim();
    if (!content) return;
    socket.emit('send_message', { content });
    inputEl.value = '';
    inputEl.focus();
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Typing indicator (broadcast)
  inputEl.addEventListener('input', () => {
    socket.emit('typing', { username: ME });
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => socket.emit('stopped_typing', { username: ME }), 1800);
  });

  // Socket events
  socket.on('new_message', data => {
    appendMessage(data, data.username === ME);
  });

  socket.on('system', data => appendSystem(data.msg));

  socket.on('typing_update', users => {
    const others = users.filter(u => u !== ME);
    if (others.length) {
      typingText.textContent = others.length === 1
        ? `${others[0]} is typing`
        : `${others.join(', ')} are typing`;
      typingEl.style.display = 'flex';
      typingEl.style.gap = '6px';
    } else {
      typingEl.style.display = 'none';
    }
  });

  // Online count polling
  async function updateOnline() {
    try {
      const r = await fetch('/api/online');
      const d = await r.json();
      document.getElementById('online-count').textContent = d.count + ' online';
    } catch {}
  }
  updateOnline();
  setInterval(updateOnline, 10000);

  scrollBottom();
</script>

<!-- Extra: server-side typing tracking -->
<script>
  // Emit typing events to all in room
  const _origEmit = socket.emit.bind(socket);
  socket.on('connect', () => {});
</script>
</body>
</html>
